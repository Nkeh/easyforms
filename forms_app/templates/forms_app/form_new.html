{% extends "base.html" %}

{% block title %}New form — Easyforms{% endblock %}

{% block content %}
  <div class="mx-auto max-w-sm">
    <h1 class="text-2xl font-semibold text-ink">New form</h1>
    <form method="post" novalidate class="mt-6">
      {% csrf_token %}
      {% if form.non_field_errors %}
        <ul class="mb-4 space-y-0.5 rounded border border-danger bg-danger-soft px-4 py-2 text-sm text-danger">
          {% for error in form.non_field_errors %}<li>{{ error }}</li>{% endfor %}
        </ul>
      {% endif %}
      {% include "_form_fields.html" %}
      <button type="submit" class="btn btn-primary w-full">
        Create form
      </button>
    </form>
  </div>
{% endblock %}
