<div class="mb-4 flex items-center justify-between rounded border border-line bg-white px-4 py-2 text-sm text-ink">
  <p>Please verify your email address.</p>
  <form method="post" action="{% url 'accounts:resend_verification' %}">
    {% csrf_token %}
    <button type="submit"
            class="rounded font-medium text-signal-deep underline hover:no-underline focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ink">
      Resend verification email
    </button>
  </form>
</div>
