{% extends "base.html" %}

{% block title %}Password reset — EasyForms{% endblock %}

{% block content %}
  <h1 class="text-2xl font-semibold text-slate-900">Password reset complete</h1>
  <p class="mt-2 text-slate-600">Your password has been set. You can now log in.</p>
  <p class="mt-4">
    <a href="{% url 'accounts:login' %}"
       class="rounded font-medium text-blue-600 hover:text-blue-700 focus-visible:outline-none
              focus-visible:ring-2 focus-visible:ring-blue-500">
      Log in
    </a>
  </p>
{% endblock %}
