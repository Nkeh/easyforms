{% extends "base_centered.html" %}

{% block title %}Password reset — Easyforms{% endblock %}

{% block content %}
  <h1 class="text-2xl font-semibold text-ink">Password reset complete</h1>
  <p class="mt-2 text-ink/70">Your password has been set. You can now log in.</p>
  <p class="mt-4">
    <a href="{% url 'accounts:login' %}"
       class="rounded font-medium text-signal-deep hover:underline focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ink">
      Log in
    </a>
  </p>
{% endblock %}
