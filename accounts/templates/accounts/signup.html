{% extends "base.html" %}

{% block title %}Sign up — EasyForms{% endblock %}

{% block content %}
  <div class="mx-auto max-w-sm">
    <h1 class="text-2xl font-semibold text-slate-900">Sign up</h1>
    <form method="post" novalidate class="mt-6">
      {% csrf_token %}
      {% include "_form_fields.html" %}
      <button type="submit"
              class="w-full rounded-md bg-blue-600 px-4 py-2 font-medium text-white hover:bg-blue-700
                     focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500
                     focus-visible:ring-offset-2">
        Create account
      </button>
    </form>
    <p class="mt-4 text-sm text-slate-600">
      <a href="{% url 'accounts:login' %}"
         class="rounded font-medium text-blue-600 hover:text-blue-700 focus-visible:outline-none
                focus-visible:ring-2 focus-visible:ring-blue-500">
        Already have an account? Log in
      </a>
    </p>
  </div>
{% endblock %}
