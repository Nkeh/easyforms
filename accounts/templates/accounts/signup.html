{% extends "base_centered.html" %}

{% block title %}Sign up — Easyforms{% endblock %}

{% block content %}
  <h1 class="text-2xl font-semibold text-ink">Sign up</h1>
  <form method="post" novalidate class="mt-6">
    {% csrf_token %}
    {% include "_form_fields.html" %}
    <button type="submit" class="btn btn-primary w-full">
      Create account
    </button>
  </form>
  <p class="mt-4 text-sm text-ink/70">
    <a href="{% url 'accounts:login' %}"
       class="rounded font-medium text-signal-deep hover:underline focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ink">
      Already have an account? Log in
    </a>
  </p>
{% endblock %}
