{% extends "base_centered.html" %}

{% block title %}Reset password — Easyforms{% endblock %}

{% block content %}
  <h1 class="text-2xl font-semibold text-ink">Reset your password</h1>
  <form method="post" novalidate class="mt-6">
    {% csrf_token %}
    {% include "_form_fields.html" %}
    <button type="submit" class="btn btn-primary w-full">
      Send reset link
    </button>
  </form>
{% endblock %}
