{% for field in form %}
  <div class="mb-4">
    <label for="{{ field.id_for_label }}" class="mb-1 block text-sm font-medium text-slate-700">
      {{ field.label }}{% if field.field.required %} <span class="text-red-500">*</span>{% endif %}
    </label>
    {{ field }}
    {% if field.help_text %}
      <p class="mt-1 text-sm text-slate-500">{{ field.help_text }}</p>
    {% endif %}
    {% if field.errors %}
      <ul id="{{ field.auto_id }}_errors" class="mt-1 space-y-0.5 text-sm text-red-600">
        {% for error in field.errors %}<li>{{ error }}</li>{% endfor %}
      </ul>
    {% endif %}
  </div>
{% endfor %}
