{% load static %}<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <title>Error {{ status }}</title>
</head>
<body class="flex min-h-full items-center justify-center text-slate-900">
  <main class="mx-auto max-w-sm px-4 py-8 text-center">
    <h1 class="text-2xl font-semibold text-slate-900">{{ status }} &mdash; Something went wrong</h1>
    <p class="mt-2 text-slate-600">{{ message }}</p>
  </main>
</body>
</html>
